{% extends "base.html" %}
{% block title %}Item Details | Visual Alchemy{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="row g-5">
        <!-- Image -->
        <div class="col-md-6">
            <img src="{{ url_for('static', filename=item['package_image_url']) }}" class="img-fluid rounded shadow"
                alt="{{ item['package_name'] }}">
        </div>

        <!-- Details -->
        <div class="col-md-6">
            <h2>{{ item['package_name'] }}</h2>
            <p><strong>Price:</strong> ${{ item['price'] }}</p>

            <p><strong>Description:</strong> {{ item['description'] }}</p>

            <!-- Booking form -->
            <form method="POST" action="{{ url_for('main.add_to_cart') }}">
                <input type="hidden" name="package_id" value="{{ item['id'] }}">
                <input type="hidden" name="item_name" value="{{ item['package_name'] }}">
                <input type="hidden" name="item_base_price" value="{{ item['price'] }}">

                <div class="mb-3">
                    <label for="hours" class="form-label">Number of Hours</label>
                    <select class="form-select" name="hours" id="hours" required>
                        {% for hour in dynamic_hours %}
                        <option value="{{ hour }}">{{ hour }} hour{{ 's' if hour > 1 else '' }}</option>
                        {% endfor %}
                    </select>
                </div>


                <div class="mb-3">
                    <label for="photographer" class="form-label">Choose a Photographer</label>
                    <select class="form-select" name="photographer" id="photographer" required>
                        <option value="">Select a photographer</option>
                        {% for photographer in photographers %}
                        <option value="{{ photographer.name }}">{{ photographer.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="location" class="form-label">Location</label>
                    <select class="form-select" name="location" id="location" required>
                        <option value="">Select a location</option>
                        {% for loc in locations %}
                        <option value="{{ loc }}">{{ loc }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="appointmentTime" class="form-label">Select Appointment Date and Time</label>
                    <input type="datetime-local" class="form-control" name="appointment_time" id="appointmentTime"
                        required>
                </div>

                <button type="submit" class="btn btn-danger flex-grow-1">Add to Booking</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
