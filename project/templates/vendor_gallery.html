{% extends "base.html" %}
{% block title %}Vendor Gallery | Visual Alchemy{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row">
        {% for pkg in packages %}
        <div class="col-12 col-sm-6 col-lg-3 mb-4">
            <div class="event-card card shadow-sm">
                <img src="{{ url_for('static', filename=pkg.package_image_url) }}" class="card-img-top"
                    alt="{{ pkg.title }}">
                <div class="card-body">
                    <h5 class="card-title">{{ pkg.title }}</h5>
                    <p class="card-text">{{ pkg.display_price }}</p>
                    <p class="card-text"><i class="bi bi-person-circle"></i> {{ pkg.photographer_name }}</p>
                    <div class="d-flex justify-content-center gap-2 flex-wrap">
                        <!-- Go to item details page -->
                        <a class="btn btn-primary flex-grow-1 d-flex align-items-center justify-content-center"
                            href="{{ url_for('main.item_details', package_id=pkg.package_id) }}">
                            <span>View Details</span>
                        </a>
                        <form action="{{ url_for('main.add_to_cart') }}" method="POST">
                            <input type="hidden" name="package_id" value="{{ pkg.package_id }}">
                            <input type="hidden" name="item_name" value="{{ pkg.title }}">
                            <input type="hidden" name="item_base_price" value="{{ pkg.price }}">
                            <input type="hidden" name="photographer" value="{{ pkg.photographer_name }}">
                            <button type="submit" class="btn btn-success">
                                Add to Cart
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
